<div class="main-content">
  <tab-nav-bar #navBar>
    @if (navBar.$expanded()) {
      <tab-nav-bar-footer>
        <div class="version">v{{ version }}</div>
      </tab-nav-bar-footer>
    }
    <!-- The project's mark, docs/assets/mark.svg, in the theme's blue; the site's name beside it while the bar is open -->
    <tab-nav-bar-header>
      <div class="brand">
        <svg class="mark" viewBox="0 0 16 16" aria-hidden="true">
          <rect class="tile" x="0" y="0" width="11" height="3" rx="0.5" />
          <rect class="tile" x="12" y="0" width="4" height="7" rx="0.5" />
          <rect class="tile" x="12" y="8" width="4" height="8" rx="0.5" />
          <rect x="0" y="9" width="3" height="7" rx="0.5" />
          <rect x="4" y="4" width="3" height="12" rx="0.5" />
          <rect x="8" y="7" width="3" height="9" rx="0.5" />
        </svg>
        @if (navBar.$expanded()) {
          <div class="title">Tableau UI for Angular</div>
        }
      </div>
    </tab-nav-bar-header>

    <tab-nav-bar-button text="Home" link="/" [isActive]="(page$ | async) === 'home'">
      <tab-icon value="home" />
    </tab-nav-bar-button>

    <tab-nav-bar-button text="Getting started" link="/getting-started" [isActive]="(page$ | async) === 'getting-started'">
      <tab-icon value="rocket_launch" />
    </tab-nav-bar-button>

    <tab-nav-bar-button text="Dashboard" link="/dashboard" [isActive]="(page$ | async) === 'dashboard'">
      <tab-icon value="dashboard" />
    </tab-nav-bar-button>

    <tab-nav-bar-button text="Theming" link="/theming" [isActive]="(page$ | async) === 'theming'">
      <tab-icon value="palette" />
    </tab-nav-bar-button>

    <tab-nav-bar-button text="Server-side rendering" link="/ssr" [isActive]="(page$ | async) === 'ssr'">
      <tab-icon value="dns" />
    </tab-nav-bar-button>

    <tab-nav-bar-button text="CSS & Fonts" link="/css" [isActive]="(page$ | async) === 'css'">
      <tab-icon value="css" />
    </tab-nav-bar-button>

    <tab-nav-bar-button text="Icons" link="/icons" [isActive]="(page$ | async) === 'icons'">
      <tab-icon value="add_circle" />
    </tab-nav-bar-button>

    <tab-nav-bar-button text="Local Development" link="/local-development" [isActive]="(page$ | async) === 'local-development'">
      <tab-icon value="developer_guide" />
    </tab-nav-bar-button>
    <tab-nav-bar-button text="Monaco Editor" link="/monaco" [isActive]="(page$ | async) === 'monaco'">
      <tab-icon value="code" />
    </tab-nav-bar-button>

    <tab-separator />

    <tab-nav-bar-button text="Buttons" link="/buttons" [isActive]="(page$ | async) === 'buttons'">
      <tab-icon value="trackpad_input" />
    </tab-nav-bar-button>

    <tab-nav-bar-button text="Checkbox" link="/checkbox" [isActive]="(page$ | async) === 'checkbox'">
      <tab-icon value="check_box" />
    </tab-nav-bar-button>

    <tab-nav-bar-button text="Form Fields" link="/form-fields" [isActive]="(page$ | async) === 'form-fields'">
      <tab-icon value="edit_square" />
    </tab-nav-bar-button>

    <tab-nav-bar-button text="Date Picker" link="/date-picker" [isActive]="(page$ | async) === 'date-picker'">
      <tab-icon value="calendar_clock" />
    </tab-nav-bar-button>

    <tab-nav-bar-button text="Radio Groups" link="/radios" [isActive]="(page$ | async) === 'radios'">
      <tab-icon value="radio_button_checked" />
    </tab-nav-bar-button>

    <tab-nav-bar-button text="Select dropdown" link="/select" [isActive]="(page$ | async) === 'select'">
      <tab-icon value="dropdown" />
    </tab-nav-bar-button>

    <tab-nav-bar-button text="List" link="/list" [isActive]="(page$ | async) === 'list'">
      <tab-icon value="format_list_bulleted" />
    </tab-nav-bar-button>
    <tab-nav-bar-button text="Table" link="/table" [isActive]="(page$ | async) === 'table'">
      <tab-icon value="table" />
    </tab-nav-bar-button>
    <tab-nav-bar-button text="Chips" link="/chips" [isActive]="(page$ | async) === 'chips'">
      <tab-icon value="variables" />
    </tab-nav-bar-button>

    <tab-nav-bar-button text="Dialogs" link="/dialogs" [isActive]="(page$ | async) === 'dialogs'">
      <tab-icon value="dialogs" />
    </tab-nav-bar-button>

    <tab-nav-bar-button text="Expansion Panel" link="/expansion-panel" [isActive]="(page$ | async) === 'expansion-panel'">
      <tab-icon value="top_panel_open" />
    </tab-nav-bar-button>

    <tab-nav-bar-button text="Snackbar" link="/snackbar" [isActive]="(page$ | async) === 'snackbar'">
      <tab-icon value="toast" />
    </tab-nav-bar-button>
    <tab-nav-bar-button text="Tooltips" link="/tooltips" [isActive]="(page$ | async) === 'tooltips'">
      <tab-icon value="tooltip" />
    </tab-nav-bar-button>
    <tab-nav-bar-button text="Menu" link="/menu" [isActive]="(page$ | async) === 'menu'">
      <tab-icon value="more_vert" />
    </tab-nav-bar-button>
    <tab-nav-bar-button text="Tabs" link="/tabcontrol" [isActive]="(page$ | async) === 'tabcontrol'">
      <tab-icon value="tabs" />
    </tab-nav-bar-button>
    <tab-nav-bar-button text="Nav Bar" link="/navbar" [isActive]="(page$ | async) === 'navbar'">
      <tab-icon value="side_navigation" />
    </tab-nav-bar-button>
    <tab-nav-bar-button text="Tree" link="/tree" [isActive]="(page$ | async) === 'tree'">
      <tab-icon value="flowchart" />
    </tab-nav-bar-button>
    <tab-nav-bar-button text="Drawer" link="/drawer" [isActive]="(page$ | async) === 'drawer'">
      <tab-icon value="side_navigation" />
    </tab-nav-bar-button>

    <tab-nav-bar-button text="Arrow Scroller" link="/scroller" [isActive]="(page$ | async) === 'scroller'">
      <tab-icon value="unfold_more_double" />
    </tab-nav-bar-button>
    <tab-nav-bar-button text="Virtualization" link="/virtualize" [isActive]="(page$ | async) === 'virtualize'">
      <tab-icon value="receipt" />
    </tab-nav-bar-button>
    <tab-nav-bar-button text="Clipboard" link="/clipboard" [isActive]="(page$ | async) === 'clipboard'">
      <tab-icon value="content_paste" />
    </tab-nav-bar-button>
    <tab-separator />
    <tab-nav-bar-button text="Sample Disabled" link="/" [isActive]="false" [disabled]="true">
      <tab-icon value="home" />
    </tab-nav-bar-button>
  </tab-nav-bar>
  <div class="page-column">
    <button class="palette-button" color="plain" layout="icon" [attachedMenu]="paletteMenu">
      <tab-icon value="palette" label="Theme" />
    </button>
    <ng-template #paletteMenu="menu" menu>
      <div class="palette-menu">
        <div>
          <tab-label>Color Palette</tab-label>
          <tab-button-toggle aria-label="Color Palette" [selectedValue]="$paletteTheme()" (selectedValueChange)="paletteThemeChange($event!)">
            <tab-option icon="light_mode" hint="Light Mode" value="light" />
            <tab-option icon="dark_mode" hint="Dark Mode" value="dark" />
            <tab-option icon="night_sight_auto" hint="Inherit from OS" value="auto" />
          </tab-button-toggle>
        </div>

        <tab-form-field>
          <tab-label>Base Font Size</tab-label>
          <input type="number" [value]="$paletteFontSize()" [min]="10" [max]="24" (input)="setPaletteFontSize($event)" />
          <tab-suffix>px</tab-suffix>
        </tab-form-field>
      </div>
    </ng-template>
    <main class="page-host">
      <router-outlet />
    </main>
    <footer class="site-footer">
      <span>Not affiliated with or endorsed by Tableau or Salesforce.</span>
      <a href="https://github.com/serionist/tableau-ui-angular" target="_blank">The source on GitHub</a>
    </footer>
  </div>
</div>
