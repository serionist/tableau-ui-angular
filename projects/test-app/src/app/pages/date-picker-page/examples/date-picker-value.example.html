<div class="fields">
  <tab-form-field>
    <tab-label>A day</tab-label>
    <input type="date" min="2000-01-01" max="2030-12-31" [(value)]="$day" />
    <tab-hint>In UTC: {{ $dayUtc() }}</tab-hint>
  </tab-form-field>

  <tab-form-field>
    <tab-label>A day and a time</tab-label>
    <input type="datetime-local" min="2000-01-01T00:00" max="2030-12-31T23:59" [(value)]="$meeting" />
    <tab-hint>In UTC: {{ $meetingUtc() }}</tab-hint>
  </tab-form-field>
</div>
