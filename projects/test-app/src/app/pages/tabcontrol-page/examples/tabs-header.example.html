<!-- The headers' text is larger, and their padding smaller -->
<tab-group class="large" headerPadding="0.25rem 0.5rem">
  <tab [disabled]="true">
    <span tab-header>First tab</span>
    <p>The first tab is disabled.</p>
  </tab>
  <tab>
    <span tab-header>Second tab</span>
    <p>The second tab.</p>
  </tab>
  <tab [disabled]="true">
    <span tab-header>Third tab</span>
    <p>The third tab is disabled.</p>
  </tab>
  <tab>
    <span tab-header>Fourth tab</span>
    <p>The fourth tab.</p>
  </tab>
</tab-group>
