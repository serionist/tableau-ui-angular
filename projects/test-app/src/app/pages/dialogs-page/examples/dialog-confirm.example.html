<div class="buttons">
  <button color="primary" (click)="confirm('primary')">Primary</button>
  <button (click)="confirm('secondary')">Secondary</button>
  <button color="error" (click)="confirm('error')">Error</button>

  <button color="primary" (click)="confirm('primary', undefined)">No autofocus</button>
  <button (click)="confirm('secondary', 'accept')">Focus on accept</button>
  <button color="error" (click)="confirm('error', 'cancel')">Focus on cancel</button>
</div>
