@for (chip of $values(); track chip.key) {
  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
  <div class="chip" (mousedown)="chipClicked(chip.key, $event)">
    <ng-container
      *ngTemplateOutlet="
        $chipTemplate().templateRef;
        context: {
          $implicit: {
            data: chip,
            chipControl: self,
            selected: $highlightedChip() === chip.key,
          },
        }
      "
    />
  </div>
}
@if ($isLoadingValues()) {
  <tab-loading-gif width="1.2rem" height="1.2rem" />
}

<input #inputControl tabindex="0" name="chip-search" autocomplete="none" type="chip-search" class="search" (focus)="$focused.set(true)" (blur)="$focused.set(false)" (keydown)="inputKeydown($event)" />
