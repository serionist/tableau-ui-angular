@for (view of $chipViews(); track view.chip.key) {
  <div #chipWrapper class="chip" (mousedown)="chipClicked(view.chip.key)">
    <ng-container
      *ngTemplateOutlet="
        $chipTemplate().templateRef;
        context: {
          $implicit: {
            data: view.chip,
            chipControl: self,
            selected: view.selected && !$disabled(),
            disabled: $disabled(),
            removable: !$disabled(),
          },
        }
      "
    />
  </div>
}
@if ($isLoadingValues()) {
  <tab-loading-gif width="1.2rem" height="1.2rem" />
}

<input
  #inputControl
  tabindex="0"
  name="chip-search"
  autocomplete="off"
  type="chip-search"
  class="search"
  [disabled]="$disabled()"
  (focus)="$focused.set(true)"
  (blur)="onBlur()"
  (keydown)="inputKeydown($event)"
  (click)="$searchClicked.emit($event)"
/>
<!-- Says which chip a key highlights or removes, since focus stays in the input -->
<span class="announcement" aria-live="polite">{{ $announcement() }}</span>
