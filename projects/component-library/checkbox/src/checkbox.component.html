<!-- The label names the input and toggles it; links and buttons in the text don't, as in any label -->
<label class="control">
  <input
    type="checkbox"
    [attr.id]="$id()"
    [attr.name]="$name() ?? ''"
    [autocomplete]="$autocomplete()"
    [value]="$checked()"
    [checked]="$checked() === true"
    [indeterminate]="$checked() === 'partial'"
    [disabled]="$disabled()"
    (click)="onInputClick($event)"
    (change)="onInputChange($event)"
    (keydown)="onKeyDown($event)"
    (blur)="onTouched()"
  />

  @if ($loading()) {
    <tab-loading-gif width="1.2rem" height="1.2rem" />
  } @else {
    <span class="box">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12">
        <path fill="currentColor" transform="translate(-2, -2)" d="M7.2 12.3c-.2 0-.4-.1-.5-.2l-3-3L4.8 8l2.3 2.3 4-6.7 1.3.8L7.9 12c-.2.2-.4.3-.7.3z" />
      </svg>
      <span class="partial"></span>
    </span>
  }

  <span class="label">
    <ng-content />
  </span>
</label>

@if ($hintElement() || $errorElement()) {
  <div class="extra-info">
    @if ($hintElement() && !$errorElement()) {
      <ng-content select="tab-hint" />
    }
    @if ($errorElement()) {
      <ng-content select="tab-error" />
    }
  </div>
}
