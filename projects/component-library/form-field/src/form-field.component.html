@if ($labelElement()) {
  <div class="form-label">
    <label [id]="labelId" [attr.for]="$labelFor()"><ng-content select="tab-label" /></label>
  </div>
}

<div class="form-input-wrapper">
  @if ($prefixElement()) {
    <div #prefixContainer class="prefix">
      <ng-content select="tab-prefix" />
    </div>
  }
  <div #inputContainer class="input-container">
    <ng-content />
  </div>
  @if ($suffixElement()) {
    <div #suffixContainer class="suffix">
      <ng-content select="tab-suffix" />
    </div>
  }
</div>
@if ($hintElement() || $errorElement()) {
  <div class="form-extra-info">
    <!-- The control's aria-describedby names these wrappers while they show, the hint first -->
    @if ($hintShown()) {
      <div class="hints" [id]="hintId">
        <ng-content select="tab-hint" />
      </div>
    }
    @if ($errorElement()) {
      <div #errorContainer class="errors" [id]="errorId">
        <ng-content select="tab-error" />
      </div>
    }
  </div>
}
<!-- Says an error that appears or changes while focus is in the field -->
<div #announcer class="announcer" aria-live="polite"></div>
