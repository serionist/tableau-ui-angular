@for (option of $options(); track option.$value()) {
  <!--eslint-disable-next-line @angular-eslint/template/click-events-have-key-events-->
  <div
    #optionElement
    class="option"
    role="radio"
    [attr.aria-checked]="$selectedOption() === option"
    [attr.aria-disabled]="$disabled() || option.$disabled() ? 'true' : null"
    [attr.aria-label]="$hintName(option)"
    [tabindex]="$tabStop() === option ? 0 : -1"
    [class.disabled]="$disabled() || option.$disabled()"
    [tooltip]="$hintName(option) ?? (option.$hint() ? tooltipTemplate : undefined)"
    [tooltipContext]="{
      hint: option.$hint() ? option.$hint() : undefined,
    }"
    [class.selected]="$selectedOption() === option"
    (click)="optionClicked(option)"
  >
    <ng-container [ngTemplateOutlet]="option.$template()" [ngTemplateOutletContext]="$optionRenderContext()" />
  </div>

  <ng-template #tooltipTemplate let-hint="hint">
    @if (hint) {
      <tab-hint class="hint">
        @if ($isTemplate(hint)) {
          <ng-container [ngTemplateOutlet]="hint" />
        } @else {
          {{ hint }}
        }
      </tab-hint>
    }
  </ng-template>
}
