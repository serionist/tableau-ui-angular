<ng-template
  #treeNodeTemplate
  let-$childrenIndent="$childrenIndent"
  let-$expandButtonSize="$expandButtonSize"
  let-$expandButtonColorInherited="$expandButtonColor"
  let-$expandButtonGap="$expandButtonGap"
  let-$expandButtonTooltip="$expandButtonTooltip"
  let-$expandButtonAlign="$expandButtonAlign"
  let-$keepButtonOffsetOnNoChildren="$keepButtonOffsetOnNoChildren"
  let-$treeItem="$treeItem"
  let-$tabStopId="$tabStopId"
>
  @let item = $treeItem?.(headerButtonId);
  <!-- The node's row is its treeitem, and says whether it is open; the button is for the pointer only -->
  <!-- The rule reports on the role's own line, which a next-line disable above this tag doesn't reach, so the disable ends
  inside the row -->
  <!-- eslint-disable @angular-eslint/template/role-has-required-aria -- ARIA 1.2 inherits a required aria-selected from option, but the ARIA 1.3 draft, the APG and axe give a node that can't be selected none; aria-query 5.3.2 follows 1.2; the maintainer approved this exception on 2026-11-01 -->
  <div
    #row
    class="tree-node-container"
    role="treeitem"
    [attr.aria-level]="item?.level"
    [attr.aria-setsize]="item?.setSize"
    [attr.aria-posinset]="item?.posInSet"
    [attr.aria-expanded]="$children().length === 0 ? null : $expanded()"
    [attr.tabindex]="$tabStopId?.() === headerButtonId ? 0 : -1"
    [style.marginLeft]="`calc(${$depth()} * ${$childrenIndent()})`"
    [style.alignItems]="$expandButtonAlign()"
    [style.gap]="$expandButtonGap()"
  >
    <!-- eslint-enable @angular-eslint/template/role-has-required-aria -->
    <button
      layout="icon"
      color="plain"
      class="header-button"
      type="button"
      tabindex="-1"
      aria-hidden="true"
      [id]="headerButtonId"
      [inline]="true"
      [style.visibility]="$children().length === 0 ? 'hidden' : 'visible'"
      [style.fontSize]="$expandButtonSize()"
      [style.width]="$children().length !== 0 || $keepButtonOffsetOnNoChildren() ? $expandButtonSize() : '0px'"
      [style.minWidth]="'0px'"
      [style.height]="$expandButtonSize()"
      [style.color]="$expandButtonColor() || $expandButtonColorInherited()"
      [tooltip]="$expanded() ? $expandButtonTooltip()?.collapse : $expandButtonTooltip()?.expand"
      [tooltipPosition]="$expandButtonTooltip()?.position"
      [tooltipMargin]="$expandButtonTooltip()?.margin"
      [tooltipContext]="$expandButtonTooltip()?.context"
      (mousedown)="$event.preventDefault()"
      (click)="toggle(row)"
    >
      <tab-icon [value]="$expanded() ? 'keyboard_arrow_down' : 'keyboard_arrow_right'" />
    </button>
    <div class="header-content">
      @if ($expanded() && $expandedContent()) {
        <ng-content select="[expandedContent]" />
      } @else if (!$expanded() && $collapsedContent()) {
        <ng-content select="[collapsedContent]" />
      }
      <ng-content />
    </div>
  </div>
</ng-template>
