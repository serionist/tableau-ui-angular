@for (option of $options(); track option.$value()) {
  <!-- The label selects through its input's change, the one path that selects -->
  <label class="radio-option" [class.disabled]="$disabled() || option.$disabled()" [class.selected]="$selectedOption() === option">
    <input
      type="radio"
      [value]="option.$value()"
      [checked]="$selectedOption() === option"
      [tabindex]="$disabled() || option.$disabled() ? -1 : 0"
      [disabled]="$disabled() || option.$disabled()"
      [name]="name"
      (change)="selectValue(option)"
      (keydown)="onKeyDown($event, option)"
      (blur)="onTouched()"
    />
    <div class="box">
      @if ($selectedOption() === option) {
        <div class="filler"></div>
      }
    </div>

    <div class="label">
      <ng-container [ngTemplateOutlet]="option.$template()" [ngTemplateOutletContext]="optionTemplateContext" />
    </div>
  </label>
}

@if ($errorElement()) {
  <div class="extra-info">
    <ng-content select="tab-error" />
  </div>
}
