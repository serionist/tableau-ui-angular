# CodeQL code scanning, with the security-extended queries, on every pull request, every push to main and once a week,
# so new queries also reach code that has not changed. Results go to the repository's Security tab and annotate the PR.
#
# The library, the demo app and the tools are read as written ("javascript-typescript", build mode none: nothing to
# build). The workflows themselves ("actions") are scanned too, for script injection and over-broad permissions.
#
# This is CodeQL's advanced setup: the repository's default setup must stay off, or the two uploads conflict.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

concurrency:
  # As in ci.yml: superseded PR runs are cancelled, and each push to main or weekly run keeps its own result.
  group: codeql-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyse:
    name: Analyse (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Uploads the results to code scanning.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
