name: Bug report
description: A component that does something wrong in your Angular app.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A security vulnerability goes through a [private report](https://github.com/serionist/tableau-ui-angular/security/advisories/new), never an issue: anyone can read an issue. Leave out passwords, tokens, your Tableau Server's address and any real user's data.
  - type: input
    id: component
    attributes:
      label: Component
      description: Its selector or class, and the entry point you import it from.
      placeholder: tab-select, from tableau-ui-angular/select
    validations:
      required: true
  - type: input
    id: library-version
    attributes:
      label: tableau-ui-angular version
      description: '`npm ls tableau-ui-angular` in your app.'
      placeholder: 0.1.129
    validations:
      required: true
  - type: input
    id: angular-version
    attributes:
      label: Angular version
      description: '`ng version` in your app, or `@angular/core` in its package-lock.json.'
      placeholder: 22.2.3
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      description: Every one you saw it in.
      placeholder: Firefox 143 on Windows 11
    validations:
      required: true
  - type: dropdown
    id: ssr
    attributes:
      label: Rendered on the server?
      description: Whether your app uses server-side rendering or prerendering.
      options: ['No', 'Yes, server-side rendering', 'Yes, prerendering', "I don't know"]
  - type: input
    id: reproduction
    attributes:
      label: A StackBlitz or a repository that shows it
      description: The smallest Angular app that shows the bug, on [StackBlitz](https://stackblitz.com) or in a public repository. It is the fastest way to a fix.
      placeholder: https://stackblitz.com/edit/...
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The template and the component code that use it, and what you did (clicked, typed, a value set from a form).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: With any error from the browser's console, or from the build.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: Nothing above holds a password, a token, or a real user's data.
          required: true
